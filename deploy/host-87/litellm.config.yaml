# LiteLLM gateway — the fleet's single OpenAI-compatible endpoint.
#
# Mounted read-only at /app/config.yaml. If this file is missing, Docker creates
# a DIRECTORY at that path and LiteLLM dies with `IsADirectoryError` — which
# reads as a LiteLLM bug rather than a missing file. Do not delete it.
#
# NAMING (docs/06): models are named by PROMISE, not by parameter count. A user
# picking `chat` should get the same class of answer regardless of which host
# served it. Version numbers and quantisation formats belong in `model`, never in
# the public name.
#
# M1 defines ONE model. The ladder arrives at M2, when the fleet controller can
# actually move between rungs.

# EMPTY ON PURPOSE. The fleet controller owns this catalog (docs/06 section 7):
# it registers a deployment when a rung goes live and deletes it when the host
# yields, through /model/new and /model/delete against the database.
#
# A deployment declared HERE cannot be deleted through that API -- the attempt
# returns `Model with id=chat-226 not found in db`, because a config-file entry
# has no database row. The consequence is not a missing feature: the controller
# parks the model on a yielding host and the gateway keeps routing chat to it,
# so users see failures precisely when the platform was being polite.
#
# The trade is deliberate and worth stating: with the catalog in the database,
# a controller that is down means an empty catalog. That is the cost of having
# routing follow the fleet, and it is why the controller restarts unless-stopped.
model_list: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL

  # The fleet controller adds and removes deployments through the admin API as
  # hosts yield and reclaim (docs/06 section 7). Without this the API accepts a
  # change and loses it, because the catalog lives only in this file -- and the
  # controller would appear to reroute while the gateway kept sending traffic to
  # a sleeping model.
  #
  # Rewriting this file instead was considered and rejected there: a restart
  # drops in-flight streams, and a config error takes the whole gateway down.
  store_model_in_db: true

  # Refuse a request the backend cannot serve rather than queueing it behind a
  # model that is asleep. The controller pulls deployments out of routing when a
  # host yields; this makes that removal take effect immediately.
  enable_pre_call_checks: true

litellm_settings:
  # NOTHING leaves this network. LiteLLM phones home by default, and prompts are
  # the most sensitive thing the platform handles (N1).
  telemetry: false
  turn_off_message_logging: true

  # Fail fast. A hung backend must not hold a client connection open: the fleet
  # controller may be mid-swap, and the gateway should say so rather than wait.
  request_timeout: 600
  num_retries: 1

router_settings:
  routing_strategy: simple-shuffle

  # THIS IS WHAT MAKES YIELDING INVISIBLE. When someone claims .226, the
  # controller deletes `chat` from the catalog and parks the model. Without a
  # fallback the next request 404s, and the user experiences the platform's good
  # manners as an outage.
  #
  # `chat-small` is a genuinely smaller model on a DIFFERENT host (.87), not a
  # lower rung on the contended one. Swapping models on .226 would need the agent
  # to restart vLLM with different weights -- verbs it does not implement -- and
  # would hand a service the power to restart processes on somebody's
  # workstation, which docs/08 section 6.4 is deliberately careful about. Falling
  # back to idle hardware needs neither.
  #
  # The honest consequence: while .226 is claimed, answers come from a 4B model
  # and are noticeably weaker. Better than nothing, worse than the 14B, and the
  # dashboard shows which rung is live so the drop is visible rather than
  # mysterious.
  fallbacks: [{"chat": ["chat-small"]}]
