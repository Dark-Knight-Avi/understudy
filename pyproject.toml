[project]
name = "ai-platform"
version = "0.1.0"
description = "Self-hosted AI platform for three shared GPU workstations"
requires-python = ">=3.11"
dependencies = []

# uv workspace: each service is its own package with its own deps, but one
# lockfile and one virtualenv for the repo. See docs/delivery-plan.md section 2.
[tool.uv.workspace]
members = ["services/*"]

[dependency-groups]
# Tooling for the M0 spikes. Deliberately NOT a service dependency -- the spikes
# run on the hosts before any service exists.
spikes = [
    "torch>=2.4",
    "httpx>=0.27",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# ADR-0006: type hints are what keep the API schemas contracts rather than
# documentation. Run this in the deploy step, not just locally.
#
# Every service owns a `tests` package, so a repo-wide run collides on the
# duplicate module name and aborts before checking any source at all. Excluding
# them keeps `mypy services/` meaningful; ruff still lints the tests, and the
# tests themselves are fully annotated by convention.
exclude = ["/tests/"]
